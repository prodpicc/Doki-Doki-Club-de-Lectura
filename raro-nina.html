<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Club de Lectura</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>

    <div class="pantalla-juego">
        <img src="img/sala-lectura.jpg" alt="Sala de lectura" class="fondo-img">
        <img src="img/nina.png" alt="Nina" class="personaje">

        <div class="caja-dialogo">
            <div class="nombre-personaje">Nina</div>
            <p class="texto-dialogo">¿Eh? ¿Por qué?</p>
            <form class="opciones" id="form-raro-nina">
                <input type="text" id="input-raro-nina" class="input-nombre" placeholder="……….">
                <button type="submit" class="boton">Continuar →</button>
            </form>
        </div>
    </div>

    <script>
        (function () {
            const form = document.getElementById("form-raro-nina");
            const input = document.getElementById("input-raro-nina");
            form.addEventListener("submit", function (e) {
                e.preventDefault();
                const texto = (input.value || "").trim().toLowerCase();
                if (texto === "alessa") {
                    try {
                        if (window.parent) {
                            if (typeof window.parent.detenerMusicaFondo === "function") {
                                window.parent.detenerMusicaFondo();
                            }
                            window.parent.postMessage("DETENER_MUSICA", "*");
                            const bgm = window.parent.document.getElementById("musica-fondo");
                            if (bgm) {
                                bgm.pause();
                                bgm.muted = true;
                            }
                        }
                    } catch (err) {}
                    window.location.href = "monika-alerta.html";
                } else {
                    window.location.href = "despedida-raro-nina.html";
                }
            });
        })();
    </script>

</body>
</html>
