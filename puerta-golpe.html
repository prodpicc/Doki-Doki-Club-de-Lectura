<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Club de Lectura - La Puerta</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>

    <audio autoplay>
        <source src="audio/golpes.mp3" type="audio/mpeg">
    </audio>

    <div class="pantalla-juego">
        <!-- FONDO DE LA PUERTA -->
        <iframe class="fondo-embed" src="https://savedly.net/embed/d8vuegak" allowfullscreen loading="lazy"></iframe>

        <!-- PUERTA ABIERTA -->
        <div class="puerta-contenedor">
            <iframe class="puerta-embed" src="https://savedly.net/embed/rwjypt9n" allowfullscreen loading="lazy"></iframe>
        </div>

        <!-- SPRITE DE PHOEBE -->
        <div class="sprite-contenedor">
            <iframe class="sprite-embed" src="https://savedly.net/embed/sj7wrc2s" allowfullscreen loading="lazy"></iframe>
        </div>

        <div class="caja-dialogo">
            <div class="nombre-personaje">Phoebe</div>
            <p class="texto-dialogo">
                ¡Buenos días! ¿Venís al club de lectura? ¡Bienvenida! ¿Cómo te llamás?
            </p>
            
            <div class="opciones">
                <input type="text" class="input-nombre" placeholder="Escribe tu nombre aquí...">
                <a href="sala-intro.html" class="boton">¡Sí! Pasar a la sala →</a>
            </div>
        </div>
    </div>

</html>
