<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Club de Lectura - ¿Por qué?</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>

    <div class="pantalla-juego fondo-sala">
        <img src="img/phoebe.png" alt="Personaje" class="personaje">

        <div class="caja-dialogo">
            <div class="nombre-personaje">¿Eh?</div>
            <p class="texto-dialogo">
                ¿Eh? ¿Por qué te pareció raro?
            </p>
            
            <div class="opciones">
                <!-- El atributo pattern valida si el jugador escribió "Monika" (mayúsculas o minúsculas) sin usar JavaScript -->
                <input type="text" class="input-nombre input-secreto" placeholder="Escribe tu razón..." required pattern="[Mm][Oo][Nn][Ii][Kk][Aa]">
                
                <!-- Si escribe cualquier otra cosa, este botón lleva al final normal -->
                <a href="final-normal.html" class="boton btn-normal">Enviar respuesta</a>
                
                <!-- Si escribe "Monika", CSS intercambia automáticamente el botón para llevar al final secreto -->
                <a href="final-secreto.html" class="boton btn-secreto">Enviar respuesta</a>
            </div>
        </div>
    </div>

</body>
</html>
